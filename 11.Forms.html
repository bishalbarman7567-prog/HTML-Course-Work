<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Tags</title>
</head>
<body>
    <form>
        <h1>Registration Form</h1>
        <label><b>Full Name: </b></label>
        <input type="text" placeholder="Enter Your Name"><br><br>
        <label><b>Email: </b></label>
        <input type="email" placeholder="Enter Your Email"><br><br>
        <label><b>Gender: </b></label>
        <input type="radio" name="gender">Male
        <input type="radio" name="gender">Female<br><br>
        <label><b>Password: </b></label>
        <input type="password" placeholder="Enter Your Password"><br><br>
        <label><b>Technologies: </b></label>
        <input type="checkbox">HTML
        <input type="checkbox">CSS
        <input type="checkbox">JavaScript<br><br>
        <label><b>Phone Number: </b></label>
        <input type="tel" placeholder="Enter Your Phone Number"><br><br>
        <label><b>Experience: </b></label>
        <input type="number" placeholder="Years of Experience"><br><br>
        <label><b>Date-Of-Birth: </b></label>
        <input type="date"><br><br>
        <label><b>Time: </b></label>
        <input type="time"><br><br>
        <label><b>Range: </b></label>
        <input type="range"><br><br>
        <label><b>Favorite Colour: </b></label>
        <input type="color"><br><br>
        <input type="submit">
        <input type="reset"><br><br>
        <label><b>Select Your Country: </b></label>
        <select>
            <option>India</option>
            <option>USA</option>
            <option>UK</option>
            <option>Australia</option>
            <option>Canada</option>
        </select><br><br>
        <label><b>Comments: </b></label><br>
        <textarea rows="5" cols="30" placeholder="Enter Your Comments......"></textarea>
    </form>
</body>
</html>
